    <link rel="stylesheet" crossorigin href="/roomio/assets/index-BHlapwgD.css">

  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect: 处理 404.html 跳转回来的路径
      (function () {
        var l = window.location;
        if (l.search.indexOf('?/') === 0) {
          var decoded = l.search.slice(2) + (l.hash || '');
          var segs = l.pathname.split('/');
          var base = segs.slice(0, 2).join('/') + '/';
          var path = decoded.replace(/~and~/g, '&');
          history.replaceState(null, '', base + path);
        }
      })();
    </script>
  </body>
